apiVersion: v1
kind: ConfigMap
metadata:
  name: resendbyte-config
  namespace: resendbyte
data:
  NODE_ENV: "production"
  PORT: "3000"
  API_PREFIX: "/api/v1"
  API_INTERNAL_URL: "http://resendbyte-api:3000"
  PUBLIC_URL: "https://app.example.com"
  BETTER_AUTH_URL: "https://app.example.com"
  BETTER_AUTH_TRUSTED_ORIGINS: "https://app.example.com"
  CORS_ORIGIN: "https://app.example.com"
  DATABASE_POOL_SIZE: "10"
  DATABASE_STATEMENT_TIMEOUT: "5000"
  REDIS_POOL_SIZE: "15"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "1000"
  SMTP_GATEWAY_PORTS: "587,2525"
  FF_ENABLE_ANALYTICS: "true"
  FF_ENABLE_WEBHOOKS: "true"
  FF_ENABLE_BATCHING: "true"
  FF_ENABLE_TEMPLATES: "true"
  FF_ENABLE_SMTP_GATEWAY: "false"
  OTEL_EXPORTER_EL_EXPORTER: "none"
  PROMETHEUS_PORT: "9090"
  AWS_REGION: "us-east-1"
  S3_REGION: "us-east-1"
  S3_BUCKET: "resendbyte-storage"
