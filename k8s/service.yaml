apiVersion: v1
kind: Service
metadata:
  name: resendbyte-api
  namespace: resendbyte
  labels:
    app: resendbyte
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: resendbyte
    tier: api
---
apiVersion: v1
kind: Service
metadata:
  name: resendbyte-web
  namespace: resendbyte
  labels:
    app: resendbyte
    tier: web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: resendbyte
    tier: web
