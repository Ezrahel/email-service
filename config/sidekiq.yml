---
:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 15) %>
:pidfile: tmp/pids/sidekiq.pid
:logfile: log/sidekiq.log
:timeout: 30
:queues:
  - [critical, 7]
  - [deliveries, 6]
  - [emails, 5]
  - [webhooks, 4]
  - [events, 3]
  - [analytics, 2]
  - [maintenance, 1]
:scheduler:
  :schedule:
    retry_failed_deliveries:
      cron: "*/5 * * * *"
      class: RetryFailedDeliveryWorker
      queue: maintenance
    metrics_aggregation:
      cron: "*/5 * * * *"
      class: MetricsAggregationWorker
      queue: analytics
    cleanup_worker:
      cron: "0 3 * * *"
      class: CleanupWorker
      queue: maintenance
    partition_maintenance:
      cron: "0 0 1 * *"
      class: PartitionMaintenanceWorker
      queue: maintenance
    analytics_aggregation_1m:
      cron: "* * * * *"
      class: AnalyticsAggregationWorker
      queue: analytics
      args: ["1m"]
    analytics_aggregation_5m:
      cron: "*/5 * * * *"
      class: AnalyticsAggregationWorker
      queue: analytics
      args: ["5m"]
    analytics_aggregation_1h:
      cron: "0 * * * *"
      class: AnalyticsAggregationWorker
      queue: analytics
      args: ["1h"]
    data_retention:
      cron: "0 4 * * *"
      class: DataRetentionWorker
      queue: maintenance
    alert_evaluation:
      cron: "*/5 * * * *"
      class: AlertEvaluationWorker
      queue: analytics
    billing_aggregation:
      cron: "0 2 * * *"
      class: BillingAggregationWorker
      queue: analytics
