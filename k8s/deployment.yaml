apiVersion: apps/v1
kind: Deployment
metadata:
  name: resendbyte-email-processor
  namespace: resendbyte
  labels:
    app: resendbyte
    tier: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: resendbyte
      worker: email-processor
  template:
    metadata:
      labels:
        app: resendbyte
        worker: email-processor
    spec:
      serviceAccountName: resendbyte
      containers:
        - name: email-processor
          image: resendbyte-worker:latest
          imagePullPolicy: Always
          command: ["node", "packages/workers/email-processor/dist/index.js"]
          envFrom:
            - configMapRef:
                name: resendbyte-config
            - secretRef:
                name: resendbyte-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
